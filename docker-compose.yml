# 《织梦》一键容器部署：docker compose up -d --build
#   前端 http://localhost:3000（/api/* 经内部网络代理到 backend:8000）；后端 http://localhost:8000
#   DASHSCOPE_API_KEY 取自同目录 .env；为空则后端自动进入本地兜底模式
name: zhimeng

services:
  backend:
    build: ./backend
    image: zhimeng-backend:latest
    env_file:
      - path: .env
        required: false
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ZM_DATA_DIR: /data
      # 成本控制：默认不调用真实插画生成（占位图）；需要时在 .env 设 ZM_DISABLE_IMAGE=0
      ZM_DISABLE_IMAGE: ${ZM_DISABLE_IMAGE:-1}
      # 可见 AI 标识（占位图角标 / 万相 "AI生成" 水印）：用户要求默认隐藏；ZM_SHOW_AI_LABEL=1 恢复
      ZM_SHOW_AI_LABEL: ${ZM_SHOW_AI_LABEL:-0}
      # 账号系统（feat/auth）：不填 .env 也能起。JWT 密钥 / 演示账号密码未设置时由后端首次启动自动生成，
      # 写入 /data/jwt_secret、/data/demo_password.txt（0600，位于命名卷 zm-db，down/up 后会话与账号保持有效）
      ZM_AUTH_REQUIRED: ${ZM_AUTH_REQUIRED:-0}       # 1 = 必须登录；0 = 匿名按演示账号 demo
      ZM_COOKIE_SECURE: ${ZM_COOKIE_SECURE:-0}       # 走 https 时设 1
      # 写接口校验 Origin：浏览器访问前端用的地址必须在白名单内（换端口/域名/IP 访问时在 .env 设 ZM_CORS_ORIGINS）
      ZM_CORS_ORIGINS: ${ZM_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
    volumes:
      - zm-db:/data              # SQLite（/data/zhimeng.db，含用户表）、jwt_secret、demo_password.txt、avatars/
      - zm-chroma:/data/chroma   # ChromaDB 向量库
      - zm-assets:/data/assets   # 生成的插画 / 配音
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:8000
        ZM_PROXY_TIMEOUT_MS: ${ZM_PROXY_TIMEOUT_MS:-180000}
        # 前端可见 AI 标识（构建期写入）：默认隐藏，=1 恢复「内容由AI生成」徽标
        NEXT_PUBLIC_ZM_SHOW_AI_LABEL: ${ZM_SHOW_AI_LABEL:-0}
    image: zhimeng-frontend:latest
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  zm-db:
  zm-chroma:
  zm-assets:

networks:
  default:
    name: zhimeng_net
    driver_opts:
      com.docker.network.bridge.name: zm-br0   # 固定网桥名，便于在宿主防火墙放行容器间流量（见 README「Docker 运行」）
