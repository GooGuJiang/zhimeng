# 《织梦》一键容器部署：docker compose up -d --build
#   前端 http://localhost:3000（/api/* 经内部网络代理到 backend:8000）；后端 http://localhost:8000
#   DASHSCOPE_API_KEY 取自同目录 .env；为空则后端自动进入本地兜底模式
name: zhimeng

services:
  backend:
    build: ./backend
    image: zhimeng-backend:${ZM_IMAGE_TAG:-latest}
    env_file:
      - path: .env
        required: false
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ZM_DATA_DIR: /data
      # 成本控制：默认不调用真实插画生成（占位图）；需要时在 .env 设 ZM_DISABLE_IMAGE=0
      ZM_DISABLE_IMAGE: ${ZM_DISABLE_IMAGE:-1}
      # 可见 AI 标识（占位图角标 / 万相 "AI生成" 水印）：用户要求默认隐藏；ZM_SHOW_AI_LABEL=1 恢复
      ZM_SHOW_AI_LABEL: ${ZM_SHOW_AI_LABEL:-0}
      # 账号系统（feat/auth）：不填 .env 也能起。JWT 密钥 / 演示账号密码未设置时由后端首次启动自动生成，
      # 写入 /data/jwt_secret、/data/demo_password.txt（0600，位于命名卷 zm-db，down/up 后会话与账号保持有效）
      ZM_AUTH_REQUIRED: ${ZM_AUTH_REQUIRED:-1}       # 交付默认 1 = 必须登录（未登录不能创建/游玩，前端跳登录页）；0 = 匿名按演示账号 demo（仅过渡/旧 e2e）
      ZM_DEMO_PASSWORD: ${ZM_DEMO_PASSWORD:-}        # 演示账号 demo 的初始密码；留空则自动生成写入 /data/demo_password.txt
      ZM_JWT_SECRET: ${ZM_JWT_SECRET:-}              # 留空则自动生成写入 /data/jwt_secret
      # 只采信这些网段转发来的 X-Forwarded-For（前端容器在 compose 私网里）；后端端口不要对公网开放
      # 只信任回环和前端容器的固定 IP（见下方 networks / frontend.ipv4_address），不再信任整个私网段
      ZM_TRUSTED_PROXIES: ${ZM_TRUSTED_PROXIES:-127.0.0.1/32,::1,${ZM_FRONTEND_IP:-172.30.53.10}/32}
      ZM_PROXY_HOPS: ${ZM_PROXY_HOPS:-1}              # 只取 XFF 从右数第 N 项（前端容器这一跳 = 1）
      ZM_LOGIN_ACCOUNT_MAX_FAILS: ${ZM_LOGIN_ACCOUNT_MAX_FAILS:-10}   # 按账号失败上限（与 IP 无关）
      ZM_LOGIN_ACCOUNT_WINDOW_MIN: ${ZM_LOGIN_ACCOUNT_WINDOW_MIN:-15}
      ZM_LOGIN_ACCOUNT_LOCK_MIN: ${ZM_LOGIN_ACCOUNT_LOCK_MIN:-15}
      ZM_REGISTER_GLOBAL_PER_HOUR: ${ZM_REGISTER_GLOBAL_PER_HOUR:-200}
      ZM_REGISTER_PER_HOUR: ${ZM_REGISTER_PER_HOUR:-10}            # 同一来源 IP 每小时注册上限（直接 compose 时所有访问者同源，见 README）
      ZM_COOKIE_SECURE: ${ZM_COOKIE_SECURE:-0}       # 走 https 时设 1
      # 写接口校验 Origin：浏览器访问前端用的地址必须在白名单内（换端口/域名/IP 访问时在 .env 设 ZM_CORS_ORIGINS）
      ZM_CORS_ORIGINS: ${ZM_CORS_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}}
    volumes:
      - zm-db:/data              # SQLite（/data/zhimeng.db，含用户表）、jwt_secret、demo_password.txt、avatars/
      - zm-chroma:/data/chroma   # ChromaDB 向量库
      - zm-assets:/data/assets   # 生成的插画 / 配音
    ports:
      # 只绑定本机回环：浏览器只需访问前端（/api 经内部网络代理）。后端信任私网段转发的 X-Forwarded-For，
      # 若对外开放该端口，外部可伪造 XFF 绕过按 IP 限流；本机 curl / E2E 的 request 夹具仍可直连。
      # 确需对外暴露后端时设 BACKEND_BIND=0.0.0.0（ZM_TRUSTED_PROXIES 默认已只含前端容器 IP）
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:8000
        ZM_PROXY_TIMEOUT_MS: ${ZM_PROXY_TIMEOUT_MS:-180000}
        # 前端可见 AI 标识（构建期写入）：默认隐藏，=1 恢复「内容由AI生成」徽标
        NEXT_PUBLIC_ZM_SHOW_AI_LABEL: ${ZM_SHOW_AI_LABEL:-0}
    image: zhimeng-frontend:${ZM_IMAGE_TAG:-latest}
    environment:
      BACKEND_ORIGIN: http://backend:8000
      # AUTH-QA-3：前端（client-ip-guard）默认丢弃客户端带来的 XFF，只写 TCP 来源地址。前面另有自己的反向代理
      # （nginx/caddy，且它用真实来源覆盖 X-Forwarded-For）时设 ZM_FRONTEND_TRUST_PROXY=1，采信上游最后一跳
      ZM_TRUST_PROXY: ${ZM_FRONTEND_TRUST_PROXY:-0}
    networks:
      default:
        ipv4_address: ${ZM_FRONTEND_IP:-172.30.53.10}
    ports:
      # 前面另有反向代理（并设 ZM_FRONTEND_TRUST_PROXY=1）时设 FRONTEND_BIND=127.0.0.1，只让反代访问前端，否则客户端可伪造 XFF
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  zm-db:
  zm-chroma:
  zm-assets:

networks:
  default:
    name: zhimeng_net
    driver_opts:
      com.docker.network.bridge.name: zm-br0   # 固定网桥名，便于在宿主防火墙放行容器间流量（见 README「Docker 运行」）
    ipam:
      config:
        # 固定子网，让前端容器有固定 IP 供后端 ZM_TRUSTED_PROXIES 精确信任；与宿主已有网段冲突时在 .env 改
        # ZM_NET_SUBNET 和 ZM_FRONTEND_IP（两者须匹配）
        - subnet: ${ZM_NET_SUBNET:-172.30.53.0/24}
