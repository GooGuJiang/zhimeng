# 《织梦》一键容器部署：docker compose up -d --build
#   前端 http://localhost:3000（/api/* 经内部网络代理到 backend:8000）；后端 http://localhost:8000
#   DASHSCOPE_API_KEY 取自同目录 .env；为空则后端自动进入本地兜底模式
name: zhimeng

services:
  backend:
    build: ./backend
    image: zhimeng-backend:latest
    env_file:
      - path: .env
        required: false
    environment:
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      ZM_DATA_DIR: /data
      # 成本控制：默认不调用真实插画生成（占位图）；需要时在 .env 设 ZM_DISABLE_IMAGE=0
      ZM_DISABLE_IMAGE: ${ZM_DISABLE_IMAGE:-1}
    volumes:
      - zm-db:/data              # SQLite（/data/zhimeng.db）
      - zm-chroma:/data/chroma   # ChromaDB 向量库
      - zm-assets:/data/assets   # 生成的插画 / 配音
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://backend:8000
        ZM_PROXY_TIMEOUT_MS: ${ZM_PROXY_TIMEOUT_MS:-180000}
    image: zhimeng-frontend:latest
    environment:
      BACKEND_ORIGIN: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  zm-db:
  zm-chroma:
  zm-assets:

networks:
  default:
    name: zhimeng_net
    driver_opts:
      com.docker.network.bridge.name: zm-br0   # 固定网桥名，便于在宿主防火墙放行容器间流量（见 README「Docker 运行」）
